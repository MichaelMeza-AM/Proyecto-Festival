spring.application.name=pago_service

server.port=8098

# Conexión a BD 
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_pagos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Como eliminamos Liquibase, Hibernate DEBE crear las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URLs para la comunicación entre microservicios (WebClient)
api.compra.url=http://compra-service:8097/compras
api.escenario.url=http://escenario-service:8093/escenarios

# Seguridad
jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026

# Logs 
logging.level.com.festival=INFO
logging.file.name=logs/pago-service.log
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n