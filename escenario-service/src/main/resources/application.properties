spring.application.name=escenario-service

server.port=8093

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_escenarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# APAGAMOS Hibernate para que Liquibase tome el control total
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# CONFIGURACIÓN DE SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Archivo físico de logs 
logging.file.name=logs/escenario-movimientos.log
logging.level.com.festival=INFO

# Formato limpio para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
# Formato limpio para el bloc de notas (.log)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n

jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026