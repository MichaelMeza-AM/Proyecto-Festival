spring.application.name=compra-service

server.port=8097

# Conexión a BD
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_compras?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Liquibase (Apagamos Hibernate automático)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Seguridad
jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026

# Logs 
logging.level.com.festival=INFO
logging.file.name=logs/compra-service.log
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{HH:mm:ss} %-5level %msg%n

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

