spring.application.name=auth-service
server.port=8094

# 1. CORRECCIÓN DE BASE DE DATOS: Apuntar correctamente a tu máquina local si usas Docker
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_festival_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 2. AGREGAR ESTA LÍNEA CRUCIAL: URL base para que el WebClient cree el perfil de usuario
# Puede ser a través del API Gateway (recomendado):
api.base-url=http://api-gateway:9090
# O directamente al servicio de usuarios si pruebas sin gateway: http://usuario-service:8091

# Clave secreta global
jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026