spring.application.name=auth-service
server.port=8094

# 1. CORRECCIÓN DE BASE DE DATOS: Apuntar correctamente a tu máquina local si usas Docker
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_festival_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 2.URL base para que el WebClient cree el perfil de usuario
api.base-url=http://usuario-service:8091

# CONFIGURACIÓN DE SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Archivo físico de logs 
logging.file.name=logs/auth-movimientos.log
logging.level.com.festival=INFO

# Formato limpio para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
# Formato limpio para el bloc de notas (.log)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n


# Clave secreta 
jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026