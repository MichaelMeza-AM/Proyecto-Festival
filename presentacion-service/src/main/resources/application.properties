spring.application.name=presentacion-service
server.port=8095

# Conexión a BD
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_presentaciones?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# CONFIGURACIÓN DE SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración del WebClient
api.base-url=http://api-gateway:9090
api.artista.exists=http://artista-service:8092/artistas/exists/%s
api.escenario.exists=http://escenario-service:8093/escenarios/exists/%s
api.artista.idsByGenero=http://artista-service:8092/artistas/genero/%s/ids
api.artista.detalle=http://artista-service:8092/artistas/%s
api.escenario.detalle=http://escenario-service:8093/escenarios/%s


# Archivo físico de logs 
logging.file.name=logs/presentacion-movimientos.log
logging.level.com.festival=INFO

# Formato limpio para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
# Formato limpio para el bloc de notas (.log)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n

jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026