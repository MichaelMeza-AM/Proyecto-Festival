spring.application.name=presentacion-service
server.port=8095

# Conexión a BD
spring.datasource.url=jdbc:mysql://localhost:3306/bd_presentaciones?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración del WebClient
api.base-url=http://localhost:9090
api.artista.exists=http://localhost:8092/artistas/exists/%s
api.escenario.exists=http://localhost:8093/escenarios/exists/%s
api.artista.idsByGenero=http://localhost:8092/artistas/genero/%s/ids

api.artista.detalle=http://localhost:8092/artistas/%s
api.escenario.detalle=http://localhost:8093/escenarios/%s


# Archivo físico de logs 
logging.file.name=logs/presentacion-movimientos.log
logging.level.com.festival=INFO

# Formato limpio para la consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
# Formato limpio para el bloc de notas (.log)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n

jwt.secret=esta_es_mi_compleja_clave_secreta_para_el_festival_2026